name: Dependency audit

on:
  schedule:
    # Every Monday 06:00 UTC. npm audit is a point-in-time check against a
    # constantly-updated CVE database -- rerunning on a schedule (not just
    # once, manually) is what actually catches newly-disclosed CVEs in
    # dependencies nothing here has touched.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
